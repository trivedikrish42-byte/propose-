name: Deploy Isha Proposal Website to GitHub Pages

# Runs automatically every time you push to the main branch,
# and builds/publishes index.html as a live public website.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:   # lets you also trigger it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # the whole repo root (index.html lives here) is published

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
